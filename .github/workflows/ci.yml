# Непрерывная интеграция: сборка и тесты на каждый push и Pull Request
name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch: # ручной запуск со вкладки Actions

# Если в ветку пришёл новый push, предыдущий незавершённый запуск отменяется
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Workflow только читает код, писать в репозиторий ему не нужно
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Ставит ту же версию SDK, что указана в global.json
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Shop.sln

      # Предупреждения считаются ошибками: в CI сборка должна быть 0/0
      - name: Build
        run: dotnet build Shop.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test Shop.sln --configuration Release --no-build --verbosity normal
